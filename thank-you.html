<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Gokap Technologies</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* MAIN PAGE */
        .thank-you-page {
            min-height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 35%, rgba(46, 0, 150, 0.25), transparent 35%),
                #000;
        }

        /* TOP BRAND */
        .brand {
            position: absolute;
            top: 30px;
            left: 6%;
            text-align: left;
            z-index: 5;
        }

        .brand-name {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 12px;
        }

        .brand-subtitle {
            margin-top: 6px;
            font-size: 11px;
            letter-spacing: 7px;
            color: #c9c9d8;
        }

        /* TOP RIGHT TAGLINE */
        .tagline {
            position: absolute;
            top: 40px;
            right: 6%;
            font-size: 12px;
            letter-spacing: 6px;
            color: #bdbdd0;
            z-index: 5;
        }

        /* MAIN CONTENT */
        .content {
            position: relative;
            z-index: 4;
            margin-top: -20px;
        }
       
        @keyframes rotateGlow {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* THANK YOU */
        h1 {
            font-size: clamp(55px, 8vw, 105px);
            font-weight: 900;
            letter-spacing: 5px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff 20%,
                    #e9e9ff 40%,
                    #b455ff 65%,
                    #00d9ff 90%
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            text-shadow:
                0 0 25px rgba(93, 54, 255, 0.25);
        }

        /* MESSAGE */
        .received {
            margin-top: 15px;

            font-size: clamp(12px, 2vw, 17px);
            letter-spacing: 8px;
            color: #eeeeff;
        }

        .message {
            margin-top: 25px;

            font-size: 17px;
            line-height: 1.8;

            color: #c6c6d8;
        }

        /* CHECK ICON */
        .check {
            width: 70px;
            height: 70px;

            margin: 28px auto;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;

            border: 2px solid #7d36ff;

            box-shadow:
                0 0 10px #7037ff,
                0 0 30px rgba(64, 100, 255, 0.7),
                inset 0 0 20px rgba(136, 0, 255, 0.25);

            background: rgba(20, 0, 60, 0.4);
        }

        /* BUTTON */
        .back-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 18px;

            min-width: 330px;
            padding: 19px 35px;

            border-radius: 50px;

            color: white;
            text-decoration: none;

            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;

            border: 2px solid transparent;

            background:
                linear-gradient(#050509, #050509) padding-box,
                linear-gradient(
                    90deg,
                    #00d9ff,
                    #7136ff,
                    #ff36df
                ) border-box;

            box-shadow:
                0 0 20px rgba(68, 44, 255, 0.3);

            transition: 0.3s ease;
        }

        .back-button span {
            font-size: 25px;
        }

        .back-button:hover {
            transform: translateY(-4px);

            box-shadow:
                0 0 20px #553cff,
                0 0 45px rgba(82, 43, 255, 0.6);
        }

        /* FOOTER */
        .footer-text {
            margin-top: 55px;

            font-size: 11px;
            letter-spacing: 8px;

            color: #8d8da5;
        }

        /* LARGE GLOW ARC */
        .arc {
            position: absolute;

            width: 1100px;
            height: 550px;

            left: 50%;
            top: 28%;

            transform: translateX(-50%);

            border-radius: 50%;

            border-top: 2px solid rgba(72, 49, 255, 0.9);

            box-shadow:
                0 0 12px #263cff,
                0 0 35px rgba(80, 20, 255, 0.7);

            z-index: 1;
        }

        /* PARTICLES */
        .particles {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #ffffff;

            box-shadow:
                0 0 8px #279cff,
                0 0 15px #6937ff;

            animation: floatParticle 5s infinite ease-in-out;
        }

        .particle:nth-child(1) {
            left: 10%;
            top: 30%;
        }

        .particle:nth-child(2) {
            left: 18%;
            top: 55%;
            animation-delay: 1s;
        }

        .particle:nth-child(3) {
            left: 30%;
            top: 20%;
            animation-delay: 2s;
        }

        .particle:nth-child(4) {
            right: 20%;
            top: 32%;
            animation-delay: 1.5s;
        }

        .particle:nth-child(5) {
            right: 10%;
            top: 48%;
            animation-delay: 3s;
        }

        .particle:nth-child(6) {
            right: 30%;
            top: 22%;
            animation-delay: 2.5s;
        }

        @keyframes floatParticle {
            0%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            50% {
                opacity: 1;
                transform: translateY(-15px);
            }
        }

        /* BOTTOM DIGITAL WAVES */
        .waves {
            position: absolute;

            bottom: -30px;
            left: 0;

            width: 100%;
            height: 180px;

            z-index: 2;

            overflow: hidden;
        }

        .wave {
            position: absolute;

            width: 120%;
            height: 130px;

            left: -10%;

            border-radius: 50%;

            border-top: 2px solid #382cff;

            box-shadow:
                0 -5px 15px rgba(55, 47, 255, 0.7);

            transform: rotate(-3deg);

            opacity: 0.7;
        }

        .wave:nth-child(1) {
            bottom: 50px;
        }

        .wave:nth-child(2) {
            bottom: 25px;
            transform: rotate(4deg);
            opacity: 0.4;
        }

        .wave:nth-child(3) {
            bottom: 0;
            transform: rotate(-2deg);
            opacity: 0.3;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            .brand {
                top: 20px;
                left: 25px;
            }

            .brand-name {
                font-size: 22px;
                letter-spacing: 7px;
            }

            .brand-subtitle {
                font-size: 8px;
                letter-spacing: 4px;
            }

            .tagline {
                display: none;
            }

            .content {
                padding: 20px;
                margin-top: 0;
            }

            .g-logo {
                width: 130px;
                height: 130px;
                font-size: 105px;
                margin-bottom: 15px;
            }

            h1 {
                font-size: 48px;
                letter-spacing: 2px;
            }

            .received {
                font-size: 10px;
                letter-spacing: 4px;
            }

            .message {
                font-size: 14px;
            }

            .back-button {
                min-width: 280px;
                padding: 16px 25px;
            }

            .footer-text {
                font-size: 8px;
                letter-spacing: 4px;
            }

            .arc {
                width: 700px;
            }
        }
    </style>
</head>

<body>

    <main class="thank-you-page">

        <!-- BRAND -->
        <div class="brand">
            <div class="brand-name">GOKAP</div>
            <div class="brand-subtitle">TECHNOLOGIES</div>
        </div>

        <!-- TAGLINE -->
        <div class="tagline">
            IDEAS &nbsp; | &nbsp; TECHNOLOGY &nbsp; | &nbsp; IMPACT
        </div>

        <!-- GLOWING ARC -->
        <div class="arc"></div>

        <!-- PARTICLES -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <!-- MAIN CONTENT -->
        <section class="content">

            <!-- G ONLY - NO IMAGE -->
            <div class="g-logo">G</div>

            <h1>THANK YOU</h1>

            <div class="received">
                YOUR MESSAGE HAS BEEN RECEIVED
            </div>

            <p class="message">
                Our team will get back to you shortly.<br>
                We appreciate your interest in Gokap Technologies.
            </p>

            <div class="check">
                ✓
            </div>

            <a href="index.html" class="back-button">
                BACK TO WEBSITE
                <span>→</span>
            </a>

            <div class="footer-text">
                BUILDING A SMARTER TOMORROW
            </div>

        </section>

        <!-- BOTTOM WAVES -->
        <div class="waves">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>

    </main>

</body>
</html>
